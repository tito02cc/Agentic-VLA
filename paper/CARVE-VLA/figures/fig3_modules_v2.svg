<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="820" viewBox="0 0 1900 820">
  <defs>
    <style>
      .title{font:700 29px "Liberation Sans",Arial,sans-serif;fill:#172033}
      .panel{font:700 23px "Liberation Sans",Arial,sans-serif}
      .head{font:700 18px "Liberation Sans",Arial,sans-serif;fill:#171c24}
      .txt{font:16px "Liberation Sans",Arial,sans-serif;fill:#2d3440}
      .sub{font:italic 15px "Liberation Sans",Arial,sans-serif;fill:#4a5260}
      .orange{fill:none;stroke:#df5b12;stroke-width:2.4;marker-end:url(#o)}
      .black{fill:none;stroke:#18212a;stroke-width:2.3;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#18212a"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#df5b12"/></marker>
  </defs>
  <rect width="1900" height="820" fill="#fff"/>
  <text x="950" y="40" text-anchor="middle" class="title">Agentic Harness Components and Safety Boundaries</text>

  <!-- A -->
  <rect x="24" y="70" width="435" height="610" rx="16" fill="#fff9f2" stroke="#df5b12" stroke-width="2"/>
  <text x="242" y="108" text-anchor="middle" class="panel" fill="#c84f0c">A) Execution Risk Monitor</text>
  <rect x="48" y="132" width="387" height="112" rx="12" fill="#fff" stroke="#df5b12" stroke-width="1.6"/>
  <text x="242" y="163" text-anchor="middle" class="head">Deployable signals only</text>
  <text x="242" y="192" text-anchor="middle" class="txt">proprio response | commanded motion</text>
  <text x="242" y="219" text-anchor="middle" class="txt">action age | uncertainty | deadline slack</text>
  <path d="M75 305H406" stroke="#8a9097" stroke-width="2"/>
  <path d="M75 305L120 300L160 307L205 285L248 303L292 302L335 268L406 290" fill="none" stroke="#df5b12" stroke-width="4"/>
  <text x="242" y="338" text-anchor="middle" class="sub">temporal evidence and event streak</text>
  <rect x="58" y="374" width="165" height="78" rx="10" fill="#fff" stroke="#df5b12"/>
  <text x="140" y="404" text-anchor="middle" class="head">Risk event</text>
  <text x="140" y="431" text-anchor="middle" class="txt">stall | slip | contact</text>
  <rect x="246" y="374" width="165" height="78" rx="10" fill="#fff" stroke="#df5b12"/>
  <text x="329" y="404" text-anchor="middle" class="head">Risk bucket</text>
  <text x="329" y="431" text-anchor="middle" class="txt">low | medium | high</text>
  <rect x="58" y="500" width="353" height="92" rx="10" fill="#fff5f3" stroke="#b62d24" stroke-width="1.7"/>
  <text x="234" y="533" text-anchor="middle" class="head" fill="#a9231d">Excluded from control decisions</text>
  <text x="234" y="563" text-anchor="middle" class="txt">simulator object poses | success predicates</text>
  <text x="242" y="642" text-anchor="middle" class="sub">high-frequency, deterministic, low cost</text>

  <!-- B -->
  <rect x="482" y="70" width="435" height="610" rx="16" fill="#f4faf4" stroke="#3f6e3f" stroke-width="2"/>
  <text x="700" y="108" text-anchor="middle" class="panel" fill="#315d3a">B) VLM Critic / Planner</text>
  <rect x="510" y="132" width="380" height="108" rx="12" fill="#fff" stroke="#3f6e3f"/>
  <text x="700" y="162" text-anchor="middle" class="head">Low-frequency semantic context</text>
  <text x="700" y="191" text-anchor="middle" class="txt">frames | task | subgoal | monitor evidence</text>
  <text x="700" y="218" text-anchor="middle" class="txt">bounded memory | remaining budgets | skills</text>
  <path class="orange" d="M700 240V282"/>
  <rect x="540" y="282" width="320" height="88" rx="12" fill="#fff8ef" stroke="#df5b12" stroke-width="1.8"/>
  <text x="700" y="315" text-anchor="middle" class="head">Typed Safety Gate</text>
  <text x="700" y="344" text-anchor="middle" class="txt">schema | confidence | budget | allowlist</text>
  <path class="orange" d="M700 370V410"/>
  <rect x="516" y="410" width="176" height="68" rx="10" fill="#fff" stroke="#3f6e3f"/>
  <text x="604" y="439" text-anchor="middle" class="head">CONTINUE</text>
  <text x="604" y="463" text-anchor="middle" class="txt">or VLA_ACT</text>
  <rect x="708" y="410" width="176" height="68" rx="10" fill="#fff" stroke="#b87813"/>
  <text x="796" y="439" text-anchor="middle" class="head">RUN_SKILL</text>
  <text x="796" y="463" text-anchor="middle" class="txt">or SAFE_STOP</text>
  <rect x="535" y="526" width="330" height="76" rx="10" fill="#fff5f3" stroke="#b62d24"/>
  <text x="700" y="557" text-anchor="middle" class="head" fill="#a9231d">Forbidden outputs</text>
  <text x="700" y="584" text-anchor="middle" class="txt">joint targets | torques | trajectories</text>
  <text x="700" y="642" text-anchor="middle" class="sub">single-flight and safe-boundary only</text>

  <!-- C -->
  <rect x="940" y="70" width="435" height="610" rx="16" fill="#f7faf5" stroke="#4d7a4d" stroke-width="2"/>
  <text x="1158" y="108" text-anchor="middle" class="panel" fill="#315d3a">C) Structured Failure Memory</text>
  <ellipse cx="1158" cy="167" rx="62" ry="18" fill="#fff" stroke="#4d7a4d" stroke-width="2"/>
  <path d="M1096 167V232C1096 255 1220 255 1220 232V167" fill="#fff" stroke="#4d7a4d" stroke-width="2"/>
  <ellipse cx="1158" cy="199" rx="62" ry="18" fill="none" stroke="#4d7a4d" stroke-width="1.5"/>
  <ellipse cx="1158" cy="231" rx="62" ry="18" fill="none" stroke="#4d7a4d" stroke-width="1.5"/>
  <rect x="975" y="289" width="366" height="184" rx="12" fill="#fff" stroke="#4d7a4d"/>
  <text x="1158" y="322" text-anchor="middle" class="head">FailureEpisodeRecord</text>
  <text x="1002" y="355" class="txt">context fingerprint + task / subgoal</text>
  <text x="1002" y="384" class="txt">policy + admitted deployment profile</text>
  <text x="1002" y="413" class="txt">failure evidence + action age</text>
  <text x="1002" y="442" class="txt">intervention + verification + outcome</text>
  <rect x="995" y="512" width="326" height="80" rx="10" fill="#f4faf4" stroke="#4d7a4d"/>
  <text x="1158" y="543" text-anchor="middle" class="head">Bounded retrieval</text>
  <text x="1158" y="571" text-anchor="middle" class="txt">context | failure | profile | expiry</text>
  <text x="1158" y="642" text-anchor="middle" class="sub">changes planner context, never emits actions</text>

  <!-- D -->
  <rect x="1398" y="70" width="478" height="610" rx="16" fill="#fff9f2" stroke="#b87813" stroke-width="2"/>
  <text x="1637" y="108" text-anchor="middle" class="panel" fill="#a6660d">D) Bounded Recovery Skill</text>
  <text x="1637" y="148" text-anchor="middle" class="head">cartesian_retract_lift_reobserve</text>
  <rect x="1428" y="181" width="95" height="75" rx="10" fill="#fff" stroke="#b87813"/>
  <text x="1476" y="211" text-anchor="middle" class="head">1</text><text x="1476" y="238" text-anchor="middle" class="txt">stabilize</text>
  <rect x="1540" y="181" width="95" height="75" rx="10" fill="#fff" stroke="#b87813"/>
  <text x="1588" y="211" text-anchor="middle" class="head">2</text><text x="1588" y="238" text-anchor="middle" class="txt">retract</text>
  <rect x="1652" y="181" width="95" height="75" rx="10" fill="#fff" stroke="#b87813"/>
  <text x="1700" y="211" text-anchor="middle" class="head">3</text><text x="1700" y="238" text-anchor="middle" class="txt">lift</text>
  <rect x="1764" y="181" width="88" height="75" rx="10" fill="#fff" stroke="#b87813"/>
  <text x="1808" y="211" text-anchor="middle" class="head">4</text><text x="1808" y="238" text-anchor="middle" class="txt">reobserve</text>
  <path class="orange" d="M1523 218H1540"/><path class="orange" d="M1635 218H1652"/><path class="orange" d="M1747 218H1764"/>
  <rect x="1432" y="306" width="420" height="120" rx="12" fill="#fff" stroke="#b87813"/>
  <text x="1642" y="338" text-anchor="middle" class="head">Operating envelope</text>
  <text x="1642" y="368" text-anchor="middle" class="txt">ActionSpec | preconditions | timeout | max actions</text>
  <text x="1642" y="398" text-anchor="middle" class="txt">verification rule | supported failure events</text>
  <rect x="1432" y="472" width="190" height="90" rx="10" fill="#f4faf4" stroke="#315d3a"/>
  <text x="1527" y="505" text-anchor="middle" class="head" fill="#315d3a">Verified</text>
  <text x="1527" y="535" text-anchor="middle" class="txt">fresh VLA replan</text>
  <rect x="1662" y="472" width="190" height="90" rx="10" fill="#fff5f3" stroke="#b62d24"/>
  <text x="1757" y="505" text-anchor="middle" class="head" fill="#a9231d">Failed / timeout</text>
  <text x="1757" y="535" text-anchor="middle" class="txt">SAFE_HOLD / STOP</text>
  <text x="1637" y="642" text-anchor="middle" class="sub">all physical actions remain contract-bounded</text>

  <!-- Shared execution boundary -->
  <rect x="260" y="718" width="1380" height="70" rx="14" fill="#edf4ff" stroke="#2057b7" stroke-width="2"/>
  <text x="950" y="748" text-anchor="middle" class="head" fill="#2057b7">Replaceable VLA Policy + Robot Adapter</text>
  <text x="950" y="774" text-anchor="middle" class="sub" fill="#2057b7">the only learned low-level action path</text>
  <path class="orange" d="M242 680V718"/><path class="orange" d="M700 680V718"/><path class="orange" d="M1158 680V718"/><path class="orange" d="M1637 680V718"/>
</svg>
