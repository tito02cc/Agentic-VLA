<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="820" viewBox="0 0 1900 820">
  <defs>
    <style>
      .title { font: 700 29px "Liberation Sans", Arial, sans-serif; fill: #172033; }
      .section { font: 700 25px "Liberation Sans", Arial, sans-serif; }
      .node { font: 700 19px "Liberation Sans", Arial, sans-serif; fill: #151922; }
      .sub { font: italic 16px "Liberation Sans", Arial, sans-serif; fill: #343b49; }
      .small { font: 15px "Liberation Sans", Arial, sans-serif; fill: #242a35; }
      .tiny { font: 14px "Liberation Sans", Arial, sans-serif; fill: #343b49; }
      .edge { fill: none; stroke: #111820; stroke-width: 2.4; marker-end: url(#blackArrow); }
      .agent { fill: none; stroke: #df5b12; stroke-width: 2.5; marker-end: url(#orangeArrow); }
      .runtime { fill: none; stroke: #6c36b2; stroke-width: 2.5; marker-end: url(#purpleArrow); }
      .feedback { fill: none; stroke: #111820; stroke-width: 2.2; stroke-dasharray: 9 7; marker-end: url(#blackArrow); }
      .box { stroke-width: 1.8; rx: 12; ry: 12; }
    </style>
    <marker id="blackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#111820"/>
    </marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#df5b12"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6c36b2"/>
    </marker>
  </defs>

  <rect width="1900" height="820" fill="#ffffff"/>

  <!-- Connections are drawn first so boxes mask line interiors. -->
  <path class="edge" d="M255 166 H348"/>
  <path class="edge" d="M255 358 H486"/>
  <path class="edge" d="M255 590 H300 V405 H486"/>
  <path class="edge" d="M255 590 H282 V235 H610 V193 H626"/>
  <path class="edge" d="M1190 412 H1538"/>
  <path class="feedback" d="M1538 470 H1508 V48 H468 V124"/>

  <path class="agent" d="M588 155 H626"/>
  <path class="agent" d="M849 155 H886"/>
  <path class="agent" d="M886 181 H849"/>
  <path class="agent" d="M738 216 V253"/>
  <path class="agent" d="M885 305 V348"/>
  <path class="agent" d="M1092 279 H1172 V216"/>
  <path class="agent" d="M1296 216 V252 H1490 V390 H1538"/>
  <path class="agent" d="M1296 216 V712 H1575"/>

  <path class="runtime" d="M838 515 V470"/>

  <!-- Inputs -->
  <rect x="18" y="34" width="238" height="742" class="box" fill="#ffffff" stroke="#222831"/>
  <text x="137" y="71" text-anchor="middle" class="section" fill="#172033">1) Inputs</text>

  <rect x="35" y="92" width="204" height="148" class="box" fill="#fbfcfd" stroke="#3a4048"/>
  <text x="137" y="123" text-anchor="middle" class="node">RGB observations</text>
  <rect x="62" y="143" width="150" height="70" rx="7" fill="#edf2f5" stroke="#7b8792"/>
  <circle cx="103" cy="178" r="18" fill="none" stroke="#222831" stroke-width="3"/>
  <circle cx="103" cy="178" r="7" fill="#222831"/>
  <path d="M126 159 h48 l16 18 -16 18 h-48" fill="none" stroke="#56616c" stroke-width="2"/>

  <rect x="35" y="276" width="204" height="164" class="box" fill="#fbfcfd" stroke="#3a4048"/>
  <text x="137" y="309" text-anchor="middle" class="node">Robot state</text>
  <circle cx="93" cy="363" r="10" fill="#ffffff" stroke="#222831" stroke-width="3"/>
  <path d="M93 353 L113 334 L140 350 L151 381" fill="none" stroke="#222831" stroke-width="8" stroke-linecap="round"/>
  <circle cx="113" cy="334" r="8" fill="#ffffff" stroke="#222831" stroke-width="3"/>
  <circle cx="140" cy="350" r="8" fill="#ffffff" stroke="#222831" stroke-width="3"/>
  <rect x="70" y="383" width="48" height="20" rx="4" fill="#dfe5e8" stroke="#222831" stroke-width="2"/>
  <text x="178" y="348" class="sub">q, qdot</text>
  <text x="178" y="378" class="sub">x_ee</text>

  <rect x="35" y="476" width="204" height="210" class="box" fill="#fbfcfd" stroke="#3a4048"/>
  <text x="137" y="509" text-anchor="middle" class="node">Task instruction</text>
  <path d="M60 544 h154 v95 h-105 l-23 20 v-20 h-26 z" fill="#ffffff" stroke="#3a4048" stroke-width="2"/>
  <text x="137" y="578" text-anchor="middle" class="small">"Pick up the mug</text>
  <text x="137" y="600" text-anchor="middle" class="small">and place it in</text>
  <text x="137" y="622" text-anchor="middle" class="small">the target bin."</text>

  <!-- CARVE-VLA boundary -->
  <rect x="302" y="25" width="1190" height="765" rx="20" fill="none" stroke="#213d88" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="799" y="6" width="205" height="38" fill="#ffffff"/>
  <text x="902" y="34" text-anchor="middle" class="title" fill="#213d88">CARVE-VLA</text>

  <!-- Agentic Harness -->
  <rect x="326" y="65" width="1138" height="250" rx="16" fill="#fffdfb" stroke="#df5b12" stroke-width="2"/>
  <text x="895" y="101" text-anchor="middle" class="section" fill="#c84f0c">2) Agentic Harness</text>

  <rect x="348" y="124" width="240" height="92" class="box" fill="#fff7ee" stroke="#df5b12"/>
  <text x="468" y="153" text-anchor="middle" class="node">Execution Risk Monitor</text>
  <path d="M394 184 h23 l10 -21 15 38 14 -30 12 13 h27" fill="none" stroke="#df5b12" stroke-width="3"/>
  <text x="468" y="208" text-anchor="middle" class="sub">high-frequency signals</text>

  <rect x="626" y="124" width="223" height="92" class="box" fill="#f4faf4" stroke="#3f6e3f"/>
  <text x="738" y="151" text-anchor="middle" class="node">Event-triggered</text>
  <text x="738" y="174" text-anchor="middle" class="node">VLM Planner</text>
  <text x="738" y="205" text-anchor="middle" class="sub">low-frequency semantics</text>

  <rect x="886" y="124" width="224" height="92" class="box" fill="#f4faf4" stroke="#3f6e3f"/>
  <text x="998" y="152" text-anchor="middle" class="node">Structured Failure Memory</text>
  <ellipse cx="998" cy="176" rx="30" ry="9" fill="#ffffff" stroke="#3f6e3f" stroke-width="2"/>
  <path d="M968 176 v22 c0 12 60 12 60 0 v-22" fill="#ffffff" stroke="#3f6e3f" stroke-width="2"/>
  <text x="998" y="209" text-anchor="middle" class="sub">typed records + expiry</text>

  <rect x="1172" y="124" width="248" height="92" class="box" fill="#fff8ef" stroke="#b87813"/>
  <text x="1296" y="153" text-anchor="middle" class="node">Recovery &amp; Safe Hold</text>
  <path d="M1270 169 l26 -11 26 11 v17 c0 13 -12 23 -26 29 -14 -6 -26 -16 -26 -29 z" fill="#ffffff" stroke="#b87813" stroke-width="2"/>
  <path d="M1286 184 l8 8 15 -19" fill="none" stroke="#b87813" stroke-width="3"/>
  <text x="1296" y="208" text-anchor="middle" class="sub">bounded skills / fail closed</text>

  <rect x="684" y="253" width="408" height="52" class="box" fill="#fff8ef" stroke="#df5b12"/>
  <text x="888" y="277" text-anchor="middle" class="node">Typed Safety Gate</text>
  <text x="888" y="298" text-anchor="middle" class="tiny">schema  |  confidence  |  budget  |  allowlist</text>

  <text x="607" y="117" text-anchor="middle" class="tiny" fill="#c84f0c">risk event</text>
  <text x="900" y="339" text-anchor="middle" class="tiny" fill="#c84f0c">typed intents only; no raw actions</text>

  <!-- Replaceable VLA -->
  <rect x="486" y="348" width="704" height="122" rx="15" fill="#edf4ff" stroke="#2057b7" stroke-width="2.2"/>
  <path d="M538 390 l34 38 M572 390 l-34 38 M555 381 v56 M531 399 l48 20 M579 399 l-48 20" stroke="#2057b7" stroke-width="3" fill="none"/>
  <text x="838" y="385" text-anchor="middle" class="section" fill="#2057b7">3) Replaceable VLA Policy</text>
  <text x="838" y="417" text-anchor="middle" class="node" fill="#2057b7">low-level action generator</text>
  <text x="838" y="448" text-anchor="middle" class="sub" fill="#2057b7">frozen during deployment</text>
  <rect x="1115" y="397" width="29" height="31" rx="5" fill="none" stroke="#2057b7" stroke-width="3"/>
  <path d="M1121 397 v-10 a9 9 0 0 1 18 0 v10" fill="none" stroke="#2057b7" stroke-width="3"/>

  <!-- Optimize Runtime -->
  <rect x="486" y="515" width="704" height="239" rx="15" fill="#faf7ff" stroke="#6c36b2" stroke-width="2.2"/>
  <text x="838" y="552" text-anchor="middle" class="section" fill="#6c36b2">4) Optimize Runtime</text>

  <rect x="508" y="576" width="202" height="98" class="box" fill="#ffffff" stroke="#6c36b2"/>
  <text x="609" y="606" text-anchor="middle" class="node">Admitted Profile</text>
  <text x="609" y="633" text-anchor="middle" class="sub">fidelity + latency</text>
  <text x="609" y="657" text-anchor="middle" class="sub">+ closed loop</text>

  <rect x="737" y="576" width="202" height="98" class="box" fill="#ffffff" stroke="#6c36b2"/>
  <text x="838" y="606" text-anchor="middle" class="node">Efficient Backend</text>
  <text x="838" y="635" text-anchor="middle" class="sub">compile  |  SMVE</text>
  <text x="838" y="659" text-anchor="middle" class="sub">|  precision</text>

  <rect x="966" y="576" width="202" height="98" class="box" fill="#ffffff" stroke="#6c36b2"/>
  <text x="1067" y="606" text-anchor="middle" class="node">Deadline &amp; Fallback</text>
  <text x="1067" y="636" text-anchor="middle" class="sub">reaction-time guard</text>

  <rect x="508" y="696" width="660" height="40" rx="8" fill="#ffffff" stroke="#6c36b2" stroke-width="1.6"/>
  <text x="838" y="722" text-anchor="middle" class="small" fill="#4f2688">model latency  |  reaction latency  |  task-cycle time  |  VRAM</text>
  <text x="858" y="503" class="tiny" fill="#6c36b2">admitted profile</text>

  <!-- Robot execution -->
  <rect x="1538" y="254" width="220" height="390" rx="16" fill="#f5faf5" stroke="#315d3a" stroke-width="2"/>
  <text x="1648" y="293" text-anchor="middle" class="section" fill="#315d3a">5) Robot Execution</text>
  <rect x="1561" y="326" width="174" height="75" class="box" fill="#ffffff" stroke="#315d3a"/>
  <text x="1648" y="360" text-anchor="middle" class="node">Execute</text>
  <text x="1648" y="384" text-anchor="middle" class="node">action chunk</text>
  <path class="edge" d="M1648 401 V433"/>
  <rect x="1561" y="433" width="174" height="75" class="box" fill="#ffffff" stroke="#315d3a"/>
  <text x="1648" y="466" text-anchor="middle" class="node">Observe</text>
  <text x="1648" y="490" text-anchor="middle" class="node">next state</text>
  <rect x="1574" y="542" width="148" height="48" rx="10" fill="#f1f8f1" stroke="#315d3a" stroke-width="1.8"/>
  <text x="1648" y="573" text-anchor="middle" class="node" fill="#315d3a">Resume</text>
  <path class="edge" d="M1648 508 V542"/>

  <rect x="1575" y="670" width="150" height="84" rx="10" fill="#fff5f3" stroke="#b62d24" stroke-width="2"/>
  <text x="1650" y="704" text-anchor="middle" class="small" fill="#a9231d">SAFE_HOLD</text>
  <text x="1650" y="728" text-anchor="middle" class="small" fill="#a9231d">/ STOP</text>
  <path d="M1628 742 h44" stroke="#b62d24" stroke-width="4"/>

  <text x="1353" y="398" text-anchor="middle" class="small">action chunks</text>
  <text x="1090" y="42" class="tiny">progress feedback</text>

  <!-- Legend -->
  <g transform="translate(1540,38)">
    <path class="edge" d="M0 0 H50"/>
    <text x="66" y="6" class="small">observations / actions</text>
    <path class="agent" d="M0 32 H50"/>
    <text x="66" y="38" class="small">Agentic decisions</text>
    <path class="runtime" d="M0 64 H50"/>
    <text x="66" y="70" class="small">runtime / profile control</text>
    <path class="feedback" d="M0 96 H50"/>
    <text x="66" y="102" class="small">traces / feedback</text>
  </g>
</svg>
