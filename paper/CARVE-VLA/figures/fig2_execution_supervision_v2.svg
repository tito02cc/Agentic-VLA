<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="720" viewBox="0 0 1900 720">
  <defs>
    <style>
      .title{font:700 30px "Liberation Sans",Arial,sans-serif;fill:#172033}
      .head{font:700 22px "Liberation Sans",Arial,sans-serif;fill:#151922}
      .txt{font:17px "Liberation Sans",Arial,sans-serif;fill:#252b36}
      .sub{font:italic 15px "Liberation Sans",Arial,sans-serif;fill:#444b58}
      .black{fill:none;stroke:#18212a;stroke-width:2.5;marker-end:url(#a)}
      .orange{fill:none;stroke:#df5b12;stroke-width:2.6;marker-end:url(#o)}
      .dash{fill:none;stroke:#18212a;stroke-width:2.2;stroke-dasharray:9 7;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#18212a"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#df5b12"/></marker>
  </defs>
  <rect width="1900" height="720" fill="#fff"/>
  <text x="950" y="42" text-anchor="middle" class="title">Multi-rate Execution Supervision</text>
  <path d="M65 72H1830" stroke="#2c333a" stroke-width="2"/>
  <path d="M1800 63L1830 72L1800 81" fill="#2c333a"/>
  <text x="1788" y="58" class="sub">time</text>

  <!-- Normal execution lane -->
  <text x="50" y="116" class="head" fill="#315d3a">Normal control path</text>
  <rect x="50" y="138" width="225" height="115" rx="13" fill="#f7fafc" stroke="#39434c" stroke-width="2"/>
  <text x="162" y="174" text-anchor="middle" class="head">Observe</text>
  <text x="162" y="202" text-anchor="middle" class="txt">RGB + robot state</text>
  <text x="162" y="228" text-anchor="middle" class="sub">task context</text>

  <rect x="340" y="138" width="250" height="115" rx="13" fill="#fff7ee" stroke="#df5b12" stroke-width="2"/>
  <text x="465" y="174" text-anchor="middle" class="head">Execution Risk Monitor</text>
  <text x="465" y="202" text-anchor="middle" class="txt">progress | action age | deadline</text>
  <text x="465" y="228" text-anchor="middle" class="sub">high-frequency, low cost</text>

  <rect x="655" y="138" width="245" height="115" rx="13" fill="#edf4ff" stroke="#2057b7" stroke-width="2"/>
  <text x="778" y="174" text-anchor="middle" class="head" fill="#2057b7">Admitted VLA Profile</text>
  <text x="778" y="202" text-anchor="middle" class="txt">typed instruction + observation</text>
  <text x="778" y="228" text-anchor="middle" class="sub">medium-rate action generation</text>

  <rect x="965" y="138" width="235" height="115" rx="13" fill="#f4faf4" stroke="#315d3a" stroke-width="2"/>
  <text x="1082" y="174" text-anchor="middle" class="head">Execute Chunk</text>
  <text x="1082" y="202" text-anchor="middle" class="txt">bounded committed horizon</text>
  <text x="1082" y="228" text-anchor="middle" class="sub">robot / simulator adapter</text>

  <rect x="1265" y="138" width="220" height="115" rx="13" fill="#f4faf4" stroke="#315d3a" stroke-width="2"/>
  <text x="1375" y="174" text-anchor="middle" class="head">Reobserve</text>
  <text x="1375" y="202" text-anchor="middle" class="txt">next deployable state</text>
  <text x="1375" y="228" text-anchor="middle" class="sub">close the control loop</text>

  <path class="black" d="M275 195H340"/>
  <path class="black" d="M590 195H655"/>
  <path class="black" d="M900 195H965"/>
  <path class="black" d="M1200 195H1265"/>
  <path class="dash" d="M1485 195H1575V105H465V138"/>
  <text x="1505" y="180" class="sub">feedback</text>

  <!-- Agentic state lane -->
  <rect x="50" y="304" width="1800" height="353" rx="18" fill="#fffdfb" stroke="#df5b12" stroke-width="2"/>
  <text x="78" y="342" class="head" fill="#c84f0c">Event-triggered Agentic path</text>

  <rect x="94" y="385" width="222" height="88" rx="13" fill="#fff7ee" stroke="#df5b12" stroke-width="2"/>
  <text x="205" y="420" text-anchor="middle" class="head">VERIFY</text>
  <text x="205" y="449" text-anchor="middle" class="txt">interpret monitor evidence</text>

  <rect x="382" y="385" width="220" height="88" rx="13" fill="#fff7ee" stroke="#df5b12" stroke-width="2"/>
  <text x="492" y="420" text-anchor="middle" class="head">RECOVER</text>
  <text x="492" y="449" text-anchor="middle" class="txt">bounded registered skill</text>

  <rect x="668" y="385" width="335" height="88" rx="13" fill="#f4faf4" stroke="#3f6e3f" stroke-width="2"/>
  <text x="835" y="418" text-anchor="middle" class="head">PLAN AT SAFE BOUNDARY</text>
  <text x="835" y="447" text-anchor="middle" class="txt">event-triggered VLM + memory</text>

  <rect x="1068" y="385" width="250" height="88" rx="13" fill="#fff7ee" stroke="#df5b12" stroke-width="2"/>
  <text x="1193" y="420" text-anchor="middle" class="head">TYPED SAFETY GATE</text>
  <text x="1193" y="449" text-anchor="middle" class="txt">schema | budget | allowlist</text>

  <rect x="1384" y="385" width="190" height="88" rx="13" fill="#fff6f3" stroke="#b62d24" stroke-width="2"/>
  <text x="1479" y="420" text-anchor="middle" class="head" fill="#a9231d">SAFE_HOLD</text>
  <text x="1479" y="449" text-anchor="middle" class="txt">heartbeat + timeout</text>

  <rect x="1640" y="385" width="150" height="88" rx="13" fill="#fff1ef" stroke="#b62d24" stroke-width="2"/>
  <text x="1715" y="434" text-anchor="middle" class="head" fill="#a9231d">STOP</text>

  <path class="orange" d="M465 253V350H205V385"/>
  <text x="205" y="374" text-anchor="middle" class="sub" fill="#c84f0c">risk event</text>
  <path class="orange" d="M316 429H382"/>
  <text x="348" y="374" class="sub" fill="#c84f0c">supported failure</text>
  <path class="orange" d="M602 429H668"/>
  <text x="635" y="374" class="sub" fill="#c84f0c">ambiguous / exhausted</text>
  <path class="orange" d="M1003 429H1068"/>
  <path class="orange" d="M1318 429H1384"/>
  <text x="1342" y="374" class="sub" fill="#c84f0c">reject / timeout</text>
  <path class="orange" d="M1574 429H1640"/>

  <path class="black" d="M492 473V535H630V280H778V253"/>
  <text x="535" y="523" class="sub">verified recovery</text>
  <path class="black" d="M1193 473V300H850V253"/>
  <text x="970" y="290" class="sub">accepted continue / VLA_ACT</text>
  <path class="orange" d="M1193 473V610H492V473"/>
  <text x="780" y="632" text-anchor="middle" class="sub" fill="#c84f0c">accepted RUN_SKILL</text>

  <rect x="82" y="532" width="320" height="82" rx="11" fill="#ffffff" stroke="#6c727a" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="242" y="560" text-anchor="middle" class="head">Independent episode budgets</text>
  <text x="242" y="586" text-anchor="middle" class="txt">failure | recovery | planner | retry</text>

  <text x="1545" y="570" text-anchor="middle" class="head" fill="#315d3a">Three execution rates</text>
  <text x="1545" y="599" text-anchor="middle" class="txt">Monitor: high  |  VLA: medium  |  VLM: low</text>
  <text x="950" y="690" text-anchor="middle" class="sub">Only the VLA emits learned low-level actions; semantic planning is isolated at safe boundaries.</text>
</svg>
